# The SQRL Forest Kitten 35, wide slice: as targets/sqrl-fk35.toml (the same card and Vivado 2019.2) but one MCOLS 16
# / WG 16 slice (2 KiB a step) on 16 channels of 512 MiB, so the slice's intake (WG x D x the core clock) and its
# bridges use all 32 HBM AXI ports (460.8 GB/s at 450 MHz) instead of 16. Channel c is an otpu_hbm_ch bridge on HBM
# ports 2c and 2c + 1 (NP 2), each port its own pseudo-channel (2c, 2c + 1: 256 MiB). The host's DMA window k (1 GiB,
# mini-switch k: channels 2k, 2k + 1) shares port 4k + 1 with channel 2k's second port (otpu_axi3_hmux, by AXI ID).
# The plan and its area estimate: SLR1 ~85% CLB, ~91% DSP, ~86% URAM (an area probe first).

[target]
name = "sqrl-fk35w"
kind = "fpga"
platform_id = 9                 # its own: the host tells it from sqrl-fk35 (platform 4) by CFG_PLATFORM
description = "SQRL FK35 wide: xcvu35p, 8 GB HBM2, XDMA Gen4 x8; 1 slice x 16 channels (WG 16), all 32 HBM ports"

[arch]
S = 1
D = 128
MCOLS = 16                      # 16 physical MXU columns, 16 weight rows a step (WG 16): 2 KiB a step
WG = 16
ACT_BLOCKS = 128
ACT_ROWS = 16
TMEM_WORDS = 131072
IMEM_WORDS = 32768
AW = 33                         # DRAM addresses of 33 bits: the card's 8 GiB
DRAM_BYTES = 8589934592         # 8 GiB: 16 channels of 512 MiB, an HBM pseudo-channel pair each
BHW = 0                         # the bank-half window is otpu_mig_pair's (DDR4); none on HBM
LANES = 8
PAIR = false                    # WG > 1: every MM in groups (GALL)
DSTEP = true
STREAM = true
SEQ_WC = true
OUTER = false                   # DeltaNet runs DSTEP, no VOP OUTER
DSTEP2 = true
KT = true                       # MM's K tail (as bcu1525-wg:bhw16)
ST16 = "e6m9"                   # DeltaNet states in 16 bits (as bcu1525-wg:bhw16)
ICACHE = false

[uarch]
MXU_IMPL = 2
MXU_CL = 16
MXU_E = 8
VPU_CL = 2
ULANES = 8
TMEM_IMPL = 3
TMEM_NSB = 2
TMEM_RPL = true
TMEM_TDP = true
TMEM_GST = true
TMEM_PMP = 1                    # pumped at 2x (core_clk2x)
TMEM_RQL = 255                  # every TMEM read port's data registered (as sqrl-fk35)
TMEM_STYLE = "ultra"
IMEM_STYLE = "block"
IMEM_WC_STYLE = "ultra"
ACT_UCOLS = 0
MXU_RF_STYLE = "block"           # the result FIFO in block RAM (w1: SLR1 CLB 99%; SLR1 BRAM 71%)
RPB = 0
WPB = 1
WIN = 32                        # the sequencer's window (as bcu1525-wg:bhw16)
FIFO_DEPTH = 2048               # the MXU's chunk FIFO, its lanes in UltraRAM
MXU_FIFO_STYLE = "ultra"
MXU_QD = 4
QUANT_R1 = true
QUANT_PW = 2
TRACE_DEPTH = 16384
PQ_WIN = 1024
CHASH = true
NAT_APF = 8
NAT_AD = 16
NAT_RD = 16
NAT_XD = 128                    # port W's reads in flight a channel (otpu_native_dram XD; default 64): at a
                                #   225 MHz core 64 x 128 B covers ~285 ns of a ~425 ns round trip (FK35 r15a's
                                #   fp4 stream 154 GB/s); 128: 207 GB/s on tb_sqrlfk (board_perf --sim, 128 MiB)
NAT_WPOST = true
NAT_SWG = true
NAT_FILL = false                # the HBM's AXI ports take WSTRB
NAT_XPOST = true
NAT_RHB = true
NAT_XSTG = 2                    # the adapters beside the slice (SLR1); the channels' AXI halves
NAT_XSTG_P = 2                  #   beside the HBM (SLR0) inside the bridges (otpu_hbm_ch N)
SE_R = 1                        # one row group on the stream engine (w1: SLR1 CLB 99% at SE_R 2, the engine 46K LUT)
DMA_DEPTH = 512

[tech]
family = "xilinxus"
part = "xcvu35p-fsvh2104-2-e"
vendor = "xilinx"

[platform]
board = "sqrl-fk"
core_mhz = 225.0                # as sqrl-fk35
mem = "hbm2"
mem_mts = 1800
mem_ctrl = "xilinx_hbm"         # AMD's HBM IP, 32 AXI3 256-bit ports
hostcal = false
channels_per_slice = 16
channel_bytes = 536870912       # channel c: pseudo-channels 2c, 2c + 1 (ports 2c, 2c + 1); the host's window k (1 GiB) channels 2k, 2k + 1
beat_bytes = 128
hbm_ports = 2                   # HBM AXI ports a channel's bridge drives: 4j and 4j + 2 in lockstep, the
                                #   channel's bytes interleaved at 32 over its two halves (otpu_hbm_ch NP 2,
                                #   CAPS2 bit26; the host's window j laid out alike). 1: port 4j alone
host = "pcie"
pcie_gen = 4
pcie_lanes = 8
# The co-simulation's channel model: one bridge's 256-bit AXI3 port, 32 bytes an aclk at 450 MHz
# (14.4 GB/s) at ~90%, HBM refresh (tRFC ~260 ns every tREFI 3.9 us), ~150 ns from the bridge's
# command to its data. Estimates until the card measures them.
sim_ch_gbps = 12.96
sim_lat_ns = 150
sim_refi_ns = 3900
sim_rfc_ns = 260
